# SNIPPET, not executed. A CI/CD pipeline for GitHub Actions: install, lint, test, build, scan, deploy, smoke test, rollback.
# Put it in .github/workflows/ci.yml. The action versions below (@v4, @v3, @v6) and the Trivy image are examples:
# newer major versions probably exist, so check for the current ones and pin them (a version tag or a commit hash).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# The least permission that works. Jobs that need more ask for it themselves.
permissions:
  contents: read

# A newer push cancels the older run of the same branch instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 1. check the code
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]           # test every supported Node line you run or may upgrade to (22 and 24: Maintenance LTS, 26: Active LTS)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm                  # caches ~/.npm, keyed by package-lock.json
      - run: npm ci                   # exact versions from the lockfile; fails if the lockfile is out of date
      - run: npm run lint
      - run: npm test
      - run: npm run build --if-present
      - run: npm audit --omit=dev --audit-level=high   # known vulnerabilities in production dependencies

  # ---------------------------------------------------------------- 2. build and scan ONE image, once
  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # Tag with the commit, never only "latest": you must always know exactly what is running where.
      # (Registry image names must be lower case. Convert github.repository if your organisation name has capitals.)
      - id: meta
        run: echo "tag=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build into the local Docker first, scan it, and only push an image that passed the scan.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (fail on HIGH or CRITICAL findings)
        # Replace :latest with a fixed Trivy version, for the same reason you never ship :latest of your own image.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --exit-code 1 --severity HIGH,CRITICAL "${{ steps.meta.outputs.tag }}"
      - name: Push (the layers come from the cache, so this is fast)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha

  # ---------------------------------------------------------------- 3. staging: deploy, then prove it works
  deploy-staging:
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Roll out the image
        run: |
          # Replace with your platform's command: kubectl, helm, aws ecs update-service, flyctl, ...
          kubectl set image deployment/orders-api api=${{ needs.image.outputs.tag }}
          kubectl rollout status deployment/orders-api --timeout=120s
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://staging.example.com/readyz"
          curl --fail --silent --show-error "https://staging.example.com/api/health-summary"

  # ---------------------------------------------------------------- 4. production: a human approves, then roll out, then roll back on failure
  deploy-production:
    needs: [image, deploy-staging]
    runs-on: ubuntu-latest
    environment: production         # configure "required reviewers" on this environment in the repository settings
    steps:
      - name: Roll out the SAME image that passed staging
        run: |
          kubectl set image deployment/orders-api api=${{ needs.image.outputs.tag }}
          kubectl rollout status deployment/orders-api --timeout=180s
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://example.com/readyz"
      - name: Roll back if anything above failed
        if: failure()
        run: kubectl rollout undo deployment/orders-api
